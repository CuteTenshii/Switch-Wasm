# The browser build uses wasm SIMD. Without it LLVM has no 128-bit vectors
# to lower to, so every fill, copy and `u128` vector-register operation in the
# emulator is scalar. Every engine the site targets has had SIMD since 2023
# (Safari 16.4 was the last), and Just Dance 2019 runs 2.4% faster a frame.
#
# `--growable-table` is what lets the JIT exist. An emitted block is installed
# by putting its `run` export in this module's own function table and calling
# the slot, because a function pointer here *is* a table index and that makes
# entering a block one `call_indirect` rather than a call out to JS. The
# linker emits the table with its maximum equal to its minimum unless told
# otherwise, and a table that cannot grow has nowhere to put a block:
# `table.grow` fails, every install answers "could not", and the translator
# silently interprets everything it translates. Nothing else about the build
# looks wrong when that happens, which is why `tools/jit_wasm_check.mjs`
# checks that blocks are not only compiled but entered.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+simd128", "-C", "link-arg=--growable-table"]
