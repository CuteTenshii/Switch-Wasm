name: Feature request
about: Suggest something the emulator or the page should do.
title: "[Feature] "
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would let you do that you can't now.
    validations:
      required: true
