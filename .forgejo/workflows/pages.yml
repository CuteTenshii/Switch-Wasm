name: Deploy to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Keep this version in step with the wasm-bindgen crate in Cargo.lock.
      - name: Install wasm-bindgen
        run: |
          curl -sSfL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C ~/.cargo/bin --strip-components=1 --wildcards '*/wasm-bindgen'

      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build wasm and demo
        run: make assets

      - uses: actions/git-pages@v2
        with:
          site: https://tenshii.moe/Switch-Wasm/
          token: ${{ forge.token }}
          source: dist/
