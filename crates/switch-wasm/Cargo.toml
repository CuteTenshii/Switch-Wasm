[package]
name = "switch-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings exposing switch-core to the browser"
license = "MIT"

[dependencies]
switch-core = { path = "../switch-core" }

[lib]
crate-type = ["cdylib"]

[features]
default = []
# WebGPU backend; makes the artifact a wasm-bindgen module.
gpu = ["dep:switch-gpu", "dep:wasm-bindgen-futures", "jit"]

# Compile and run the core's emitted wasm instead of interpreting it.
jit = ["dep:wasm-bindgen", "dep:js-sys"]

# Used directly so it can grow memory in larger steps (see `src/heap.rs`).
[target.'cfg(target_arch = "wasm32")'.dependencies.dlmalloc]
version = "0.2"

[dependencies.switch-gpu]
path = "../switch-gpu"
optional = true

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.wasm-bindgen-futures]
version = "0.4"
optional = true

[dependencies.js-sys]
version = "0.3"
optional = true

[lints]
workspace = true
