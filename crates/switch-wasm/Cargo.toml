[package]
name = "switch-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings exposing switch-core to the browser"
license = "MIT"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
switch-core = { path = "../switch-core" }
switch-relay-proto = { path = "../switch-relay-proto" }

[lib]
crate-type = ["cdylib"]

[features]
default = ["gpu"]
# WebGPU backend; makes the artifact a wasm-bindgen module.
gpu = ["dep:switch-gpu", "dep:wasm-bindgen-futures", "dep:web-sys", "jit"]

# Compile and run the core's emitted wasm instead of interpreting it.
jit = ["dep:js-sys"]

# Used directly so it can grow memory in larger steps (see `src/heap.rs`).
[target.'cfg(target_arch = "wasm32")'.dependencies.dlmalloc]
version = "0.2"

# rustls's ring needs random bytes, which a browser gives through `crypto.getRandomValues`.
[target.'cfg(target_arch = "wasm32")'.dependencies.ring]
version = "0.17"
features = ["wasm32_unknown_unknown_js"]

# ...and the current time to check certificate dates, from `Date.now`.
[target.'cfg(target_arch = "wasm32")'.dependencies.rustls-pki-types]
version = "1"
features = ["web"]

[dependencies.switch-gpu]
path = "../switch-gpu"
optional = true

[dependencies.wasm-bindgen]
version = "0.2"

[dependencies.wasm-bindgen-futures]
version = "0.4"
optional = true

[dependencies.js-sys]
version = "0.3"
optional = true

[dependencies.web-sys]
version = "0.3"
optional = true
features = [
  "BinaryType",
  "Blob",
  "Event",
  "File",
  "IdbCursorWithValue",
  "IdbDatabase",
  "IdbFactory",
  "IdbObjectStore",
  "IdbOpenDbRequest",
  "IdbRequest",
  "IdbTransaction",
  "IdbTransactionMode",
  "ImageData",
  "MessageEvent",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "StorageEstimate",
  "StorageManager",
  "WebSocket",
  "WorkerGlobalScope",
  "WorkerNavigator",
  "DedicatedWorkerGlobalScope",
  "DomStringList",
  "DomException",
]

[lints]
workspace = true
