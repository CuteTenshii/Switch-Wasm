[package]
name = "switch-core"
version = "0.1.0"
edition = "2021"
description = "Browser-oriented Nintendo Switch emulation core: container parsers and an ARM64 interpreter"
license = "AGPL-3.0-or-later"

[dependencies]
switch-opus = { path = "../opus" }
switch-vp9 = { path = "../vp9" }

[features]
# The `testing` fixture modules, for other crates' tests.
testing = []

[lints]
workspace = true

[dev-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
switch-vp9 = { path = "../vp9", features = ["testing"] }
