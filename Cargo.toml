[workspace]
resolver = "2"
members = ["crates/switch-core", "crates/switch-gpu", "crates/switch-wasm"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Used by `make wasm` and the host tools; not shipped.
[profile.dev]
opt-level = 2
debug = "line-tables-only"

[profile.test]
opt-level = 0

# The core tests execute guest code, so keep some optimisation there.
[profile.test.package.switch-core]
opt-level = 1

[workspace.lints.clippy]
# Hardware encodings are written field by field, including zero fields.
identity_op = "allow"
unusual_byte_groupings = "allow"
