[workspace]
resolver = "2"
members = ["crates/switch-core", "crates/switch-gpu", "crates/switch-wasm"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Everything that is not shipped: the browser build `make wasm` serves to
# `bun run dev`, the tests, and the host examples.
#
# The test suite runs guest code, and at `opt-level = 0` the emulator inside it
# is slow enough to dominate: the suite takes 47 s unoptimised and 20 s here,
# for no measured build-time cost. Line tables rather than full debug info,
# which is most of a build's output and is never read: `perf -s srcline` over
# the emulator, which found the last three wins, needs only the lines.
[profile.dev]
opt-level = 2
debug = "line-tables-only"

[profile.test]
opt-level = 0

# The core tests execute guest code, so keep some optimisation there. The GPU
# tests spend almost all their time compiling wgpu, not running tests; compiling
# that dependency tree without optimisation is substantially cheaper.
[profile.test.package.switch-core]
opt-level = 1

[workspace.lints.clippy]
# This codebase spells out hardware encodings field by field, an instruction
# word, a Maxwell method, an NCA header, and a field that happens to be zero
# is written out with the rest so the literal can be read against the
# reference. `(0x360) | (0 << 13) | (0x55 << 16) | (4 << 29)` is one method
# with four fields, not an expression with a redundant term, and grouping a
# system-register literal as `op0_op1_CRn_CRm_op2` is the only grouping that
# can be checked by eye. Both lints ask for the field structure to be thrown
# away.
identity_op = "allow"
unusual_byte_groupings = "allow"
