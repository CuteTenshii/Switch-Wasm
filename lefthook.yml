pre-commit:
  parallel: true
  jobs:
    - name: Cargo fmt
      glob: "*.rs"
      run: cargo fmt --all --check
      fail_text: "Not rustfmt-clean: run `cargo fmt --all`"

    - name: Clippy
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets -- -D warnings
      fail_text: "Clippy errors: run `cargo clippy --workspace --all-targets`"

    - name: Oxlint
      glob: "*.{ts,mjs}"
      run: bun run lint
      fail_text: "Lint errors: run `bun run lint --fix`"

    - name: Stylelint
      glob: "*.css"
      run: bun run stylelint
      fail_text: "Stylelint errors: run `bunx stylelint 'web/**/*.css' --fix`"

    # Vite does not type-check.
    - name: Typecheck
      glob: "*.ts"
      run: bun run typecheck

# The page tests need `make wasm` first.
pre-push:
  piped: true
  jobs:
    - name: Tests
      glob: "*.rs"
      run: cargo test --workspace
      fail_text: "Host tests failed."

    - name: Unit tests
      glob: "*.{ts,mjs}"
      run: bun run test:unit
      fail_text: "Unit tests failed."

    - name: E2E tests
      glob: "*.{ts,mjs}"
      run: bun run test:e2e
      fail_text: "Page tests failed."
