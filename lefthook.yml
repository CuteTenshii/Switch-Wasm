# Pre-commit hooks mirroring CI's lint job, installed by `bun install`.
# They check the working tree, not the index. Unset a leftover
# `core.hooksPath` first, or lefthook won't install.
pre-commit:
  piped: true
  jobs:
    - name: rustfmt
      glob: "*.rs"
      run: cargo fmt --all --check
      fail_text: "Not rustfmt-clean: run `cargo fmt --all`."

    - name: clippy
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets -- -D warnings
      fail_text: "Clippy warnings, which CI treats as errors."

    - name: eslint
      glob: "*.{ts,mjs}"
      run: bun run eslint
      fail_text: "ESLint errors: run `bunx eslint . --fix` for the stylistic ones."

    - name: stylelint
      glob: "*.css"
      run: bun run stylelint
      fail_text: "Stylelint errors: run `bunx stylelint 'web/**/*.css' --fix`."

    # Vite does not type-check.
    - name: typecheck
      glob: "*.ts"
      run: bun run typecheck
